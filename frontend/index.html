<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <div class="topbar">
            <img class="banner" src="../../../Pictures/PombaClat/pombaclat-banner_compressed.png" alt="pombaclat banner">
            <button class="btn-primary" id="btn-create-server">Create</button>
        </div>

        <div id="createServerModal">
            <input type="text" id="createServerName" placeholder="Name">
            <input type="text" id="createServerDescription" placeholder="Description">
            <select name="version" id="createServerVersion">
                <option value="1.8.9">1.8.9</option>
                <option value="1.20.1">1.20.1</option>
                <option value="1.21.1">1.21.1</option>
                <option value="1.26.1">1.26.1</option>
                <option value="26.1">26.1</option>
            </select>
            <select name="createServerType" id="createServerType">
                <option value="paper">PaperMC</option>
                <option value="vanilla">Vanilla</option>
                <option value="pumpkin">Pumpkin</option>
            </select>
            <button type="submit" id="createServerModalSubBtn">Submit</button>
        </div>

        <ul class="server-list">
            <!-- Javascript will insert the li's -->
        </ul>
    </div>

    <script src="app.js"></script>
</body>

</html>

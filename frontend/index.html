<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="topbar">
            <button class="btn-primary" id="btn-create-server">Create</button>
        </div>

        <div id="createServerModal">
            <input type="text" id="createServerName">
            <input type="text" id="createServerDescription">
            <select name="version" id="createServerVersion">
                <option value="1.8.9">1.8.9</option>
                <option value="1.20.1">1.20.1</option>
                <option value="1.21.1">1.21.1</option>
                <option value="1.26.1">1.26.1</option>
                <option value="26.1">26.1</option>
            </select>
            <input type="type" id="createServerType">
            <button type="submit" id="createServerModalSubBtn">Submit</button>
        </div>
    </div>


    <ul id="server-list"></ul>


    <script src="app.js"></script>
</body>

</html>
